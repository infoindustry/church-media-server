<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Deepgram Translation</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #f8fafc; }
    main { max-width: 760px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    p { color: #aab4c8; line-height: 1.45; }
    .card { background: #151c30; border: 1px solid #29324a; border-radius: 16px; padding: 16px; margin: 14px 0; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: grid; gap: 6px; color: #cbd5e1; font-size: 14px; }
    select, input, button { font: inherit; border-radius: 11px; border: 1px solid #36415d; padding: 12px; }
    select, input { background: #0e1528; color: white; }
    button { background: #26334f; color: white; cursor: pointer; font-weight: 700; }
    button.primary { background: #2563eb; border-color: #3b82f6; }
    button.danger { background: #991b1b; border-color: #dc2626; }
    button:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge { background: #202a42; border-radius: 999px; padding: 7px 10px; font-size: 13px; }
    .ok { background: #14532d; }
    .warn { background: #713f12; }
    .error { background: #7f1d1d; }
    .text { min-height: 80px; white-space: pre-wrap; line-height: 1.5; background: #0d1425; border-radius: 12px; padding: 12px; }
    .muted { color: #94a3b8; }
    @media (max-width: 620px) { .row { grid-template-columns: 1fr; } button { flex: 1; } }
  </style>
</head>
<body>
<main>
  <h1>Deepgram → OpenAI Text</h1>
  <p>Deepgram один раз распознаёт речь. OpenAI переводит готовые фразы на выбранные языки.</p>

  <section class="card">
    <div class="row">
      <label>Язык субтитров
        <select id="lang">
          <option value="nl">Nederlands</option>
          <option value="en">English</option>
          <option value="sr">Srpski</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="ru">Русский оригинал</option>
        </select>
      </label>
      <label>Добавить ещё язык
        <div style="display:flex;gap:8px">
          <input id="extraLang" placeholder="например: uk" maxlength="12" />
          <button id="addLang">+</button>
        </div>
      </label>
    </div>
    <div class="actions">
      <button class="primary" id="start">Запустить</button>
      <button class="danger" id="stop">Остановить</button>
      <button id="showTv">Субтитры на ТВ</button>
      <button id="showQr">QR гостям</button>
    </div>
  </section>

  <section class="card">
    <div id="badges" class="badges"></div>
    <p id="alert"></p>
  </section>

  <section class="card">
    <strong>Исходная расшифровка Deepgram</strong>
    <p class="muted">Промежуточный текст нужен для контроля микрофона; переводятся только завершённые фразы.</p>
    <div id="source" class="text">Ожидание речи…</div>
  </section>

  <section class="card">
    <strong>Последний переведённый текст</strong>
    <div id="translated" class="text">Перевод ещё не поступал.</div>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  let state = null;
  let translations = {};

  async function api(path, options = {}) {
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }
  function post(body) {
    return { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) };
  }
  function age(ts) {
    if (!ts) return '—';
    return `${Math.max(0, Math.round((Date.now() - ts) / 1000))} с`;
  }
  function badge(text, tone = '') {
    const el = document.createElement('span');
    el.className = `badge ${tone}`;
    el.textContent = text;
    return el;
  }
  function render() {
    if (!state) return;
    const b = $('badges');
    b.innerHTML = '';
    b.append(
      badge(state.running ? 'Перевод запущен' : 'Остановлен', state.running ? 'ok' : 'warn'),
      badge(`Источник: ${state.sourceLang || 'ru'}`),
      badge(`Deepgram: ${state.pipeline?.sttStatus || '—'}`, state.pipeline?.sttStatus === 'open' ? 'ok' : 'warn'),
      badge(`Soundcraft: ${state.capture?.connected ? 'подключён' : 'нет'}`, state.capture?.connected ? 'ok' : 'error'),
      badge(`Последний звук: ${age(state.capture?.lastAudioAt)}`),
      badge(`Очередь перевода: ${state.pipeline?.pendingTranslations || 0}`)
    );
    for (const lang of state.languages || []) b.append(badge(`${lang.lang}: ${lang.status}`, lang.status === 'open' ? 'ok' : lang.status.startsWith('error') ? 'error' : 'warn'));
    $('alert').textContent = state.alert || '';
    $('alert').className = state.severity === 'error' ? 'error' : state.severity === 'warning' ? 'warn' : '';
    $('start').disabled = state.running;
    $('stop').disabled = !state.running;
    if (state.pipeline?.lastSourceText) $('source').textContent = state.pipeline.lastSourceText;
    const selected = $('lang').value;
    if (translations[selected]) $('translated').textContent = translations[selected];
  }
  async function refresh() {
    try { state = await api('/api/translation/live/state'); render(); }
    catch (error) { $('alert').textContent = error.message; }
  }

  $('start').onclick = async () => {
    try {
      state = await api('/api/translation/live/start', post({ engine: 'deepgram', displayLang: $('lang').value }));
      render();
    } catch (error) { alert(error.message); }
  };
  $('stop').onclick = async () => {
    try { state = await api('/api/translation/live/stop', { method: 'POST' }); render(); }
    catch (error) { alert(error.message); }
  };
  $('addLang').onclick = async () => {
    const lang = $('extraLang').value.trim().toLowerCase();
    if (!lang) return;
    try { state = await api('/api/translation/live/ensure', post({ lang })); $('extraLang').value = ''; render(); }
    catch (error) { alert(error.message); }
  };
  $('showTv').onclick = async () => {
    try { await api('/api/translation/live/show-on-tv', post({ lang: $('lang').value })); }
    catch (error) { alert(error.message); }
  };
  $('showQr').onclick = async () => {
    try { await api('/api/translation/live/show-qr', { method: 'POST' }); }
    catch (error) { alert(error.message); }
  };
  $('lang').onchange = () => {
    const value = translations[$('lang').value];
    $('translated').textContent = value || 'Перевод для этого языка ещё не поступал.';
  };

  const events = new EventSource('/api/translation/live/stream');
  events.onmessage = event => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'status') { state = data; render(); }
      if (data.type === 'source-transcript') $('source').textContent = data.text || '';
      if (data.type === 'transcript') {
        translations[data.lang] = data.text || '';
        if (data.lang === $('lang').value) $('translated').textContent = translations[data.lang];
      }
    } catch {}
  };
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
